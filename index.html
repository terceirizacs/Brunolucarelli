  const funilKeyMap={d7:'d7',d8_14:'d814',mai:'mai',custom:'all'};
  const fKey=funilKeyMap[ATEND_PERIODO_ATUAL]||'all';
  const F=(S.funil && S.funil[fKey] && S.funil[fKey].total>0)?S.funil[fKey]:null;
  if(F){
    const taxaGeral=F.total?(100*F.total_resp/F.total):0;
    const notaCustom=(ATEND_PERIODO_ATUAL==='custom')?' · (intervalo custom mostra all-time)':'';
    h+='<div class="sec">🎯 Disparos por Funil — '+p.label+'</div>';
    h+='<div class="card"><h3>Para qual estágio do funil os disparos foram</h3><div class="d">Disparos (chatwoot) cruzados com o funil de cada aluno · '+fN(F.total)+' com e-mail identificado · <strong style="color:var(--green)">'+taxaGeral.toFixed(1)+'%</strong> dos disparos tiveram resposta do aluno no período'+notaCustom+'</div>';
    h+='<div style="font-size:11px;color:var(--t3);margin:-4px 0 12px;line-height:1.5">ℹ️ Métrica do <strong>disparo</strong> (quem recebeu E respondeu no período). Difere da "Taxa de resposta" do topo, que conta toda conversa ativa no período sobre os disparos — por isso é maior.</div>';
    const funilOrdem=['Nunca acessou','Acessou mas não consumiu','Consumiu pouco','Desengajado','Engajado','Recompra'];
    const fcores={'Nunca acessou':'#64748b','Acessou mas não consumiu':'#fb923c','Consumiu pouco':'#fbbf24','Desengajado':'#f87171','Engajado':'#34d399','Recompra':'#22d3ee'};
    const ents=Object.keys(F.por_funil||{}).map(k=>({k:k,d:(F.por_funil[k].d||0),r:(F.por_funil[k].r||0)})).sort((a,b)=>{
      const ia=funilOrdem.indexOf(a.k), ib=funilOrdem.indexOf(b.k); return (ia<0?99:ia)-(ib<0?99:ib);
    });
    ents.forEach(e=>{
      const pct=F.total?(100*e.d/F.total):0;
      const taxa=e.d?(100*e.r/e.d):0;
      const corTaxa=taxa>=40?'var(--green)':(taxa>=20?'var(--gold)':'var(--t3)');
      h+='<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><div style="width:200px;font-size:13px;color:var(--t1);font-weight:600">'+e.k+'</div>';
      h+='<div style="flex:1;background:var(--track-bg);border-radius:8px;height:22px;overflow:hidden"><div style="height:100%;width:'+Math.max(pct,3).toFixed(1)+'%;min-width:46px;background:'+(fcores[e.k]||'#8b7cf7')+';display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;color:#fff;font-weight:700;font-family:JetBrains Mono">'+pct.toFixed(1)+'%</div></div>';
      h+='<div style="width:150px;text-align:right;font-size:11.5px;color:var(--t3);font-family:JetBrains Mono">'+fN(e.d)+' disp · <span style="color:'+corTaxa+'">'+taxa.toFixed(0)+'% resp</span></div></div>';
    });
    h+='</div>';
    const ob=F.onboarding||0, og=F.ongoing||0, base=ob+og;
    h+='<div class="sec">🚀 Onboarding vs Ongoing</div>';
    h+='<div class="g2">';
    h+='<div class="card"><h3>Onboarding</h3><div class="d">Disparos a quem comprou há ≤ 30 dias</div><div style="font-size:34px;font-weight:700;font-family:JetBrains Mono;color:var(--accent);margin-top:10px">'+fN(ob)+'</div><div style="color:var(--t2);font-size:13px">'+(base?(100*ob/base).toFixed(1):0)+'% (dos com data de compra)</div></div>';
    h+='<div class="card"><h3>Ongoing</h3><div class="d">Disparos a quem comprou há > 30 dias</div><div style="font-size:34px;font-weight:700;font-family:JetBrains Mono;color:var(--teal);margin-top:10px">'+fN(og)+'</div><div style="color:var(--t2);font-size:13px">'+(base?(100*og/base).toFixed(1):0)+'% (dos com data de compra)</div></div>';
    h+='</div>';
  }

  // === BLOCO Conversas por Assunto (hierárquico, 1 conv = 1 assunto) ===
  h+='<div class="sec">💬 Conversas por Assunto</div>';
  h+='<div style="font-size:12px;color:var(--t3);margin:-10px 0 14px">Cada conversa é classificada pelo assunto dominante (prioridade: risco → técnico → dificuldade → prova → elogios → acesso → engajamento com curso → compromisso → comunidade → afetivo → 🤖 resposta automática → saudação/sem assunto). Prova social = resultado real (arremate/leilão), não só a palavra. "Resposta automática" = bot do próprio aluno respondeu (não houve engajamento pessoal).</div>';
  h+='<div class="card" style="padding:18px 22px">';
  // Ordena por % desc com "outros" no fim (idempotente caso o snapshot já venha enriquecido)
  // Ordena por tamanho (maior → menor), mantendo "Saudação / sem assunto" (outros) sempre por último
  const assuntosOrd = [...p.assuntos].filter(a=>a.n>0 && a.cat!=='outros').sort((a,b)=>{
    if(a.cat==='outros') return 1;
    if(b.cat==='outros') return -1;
    return b.pct - a.pct;
  });
  assuntosOrd.forEach(a=>{
    const tip='<div class=tt-title>'+a.emoji+' '+a.label+'</div><div class=tt-row><span class=tt-label>Conversas:</span><span class=tt-value>'+a.n+'</span></div><div class=tt-row><span class=tt-label>% do período:</span><span class=tt-value>'+a.pct.toFixed(1)+'%</span></div>';
    h+='<div style="display:flex;align-items:center;gap:12px;margin:10px 0;cursor:default" onmouseenter="showTip(event,\''+tip.replace(/'/g,'')+'\')" onmousemove="showTip(event,\''+tip.replace(/'/g,'')+'\')" onmouseleave="hideTip()">';
    h+='<div style="width:200px;font-size:13px;color:var(--t1);font-weight:600">'+a.emoji+' '+a.label+'</div>';
    h+='<div style="flex:1;background:var(--track-bg);border-radius:8px;height:22px;overflow:hidden">';
    // Garante largura mínima de 32px na barra pra caber % mesmo em valores baixos (1-3%)
    const minPct = Math.max(a.pct, 3);
    h+='<div style="height:100%;width:'+minPct.toFixed(1)+'%;min-width:46px;background:'+a.cor+';display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;color:#fff;font-weight:700;font-family:JetBrains Mono">'+a.pct.toFixed(1)+'%</div></div>';
    h+='<div style="width:90px;text-align:right;font-size:12px;color:var(--t3);font-family:JetBrains Mono">'+a.n+' conv.</div>';
    h+='</div>';
  });
  h+='</div>';

  // === Frases reais por assunto (se houver) ===
  if(p.frases && Object.keys(p.frases).length){
    h+='<div class="sec">💭 Frases reais (anonimizadas)</div>';
    h+='<div class="ins-g">';
    const ordemFrases=['risco','tecnico','dificuldade','prova','elogios','acesso','engajamento_curso','compromisso','comunidade','afetivo'];
    const mapEmoji={risco:'⚠️',tecnico:'🔧',dificuldade:'🆘',acesso:'🔓',engajamento_curso:'🎓',elogios:'👏',prova:'⭐',compromisso:'💪',comunidade:'👥',afetivo:'❤️'};
    const mapLabel={risco:'Risco / churn',tecnico:'Suporte técnico',dificuldade:'Dificuldade',acesso:'Acesso liberado',engajamento_curso:'Engajamento com curso',elogios:'Elogios / satisfação',prova:'Prova social',compromisso:'Compromisso',comunidade:'Comunidade',afetivo:'Tom afetivo'};
    const mapCor={risco:'w',tecnico:'',dificuldade:'',acesso:'ok',engajamento_curso:'ok',elogios:'ok',prova:'ok',compromisso:'ok',comunidade:'',afetivo:''};
    ordemFrases.forEach(k=>{
      if(!p.frases[k]||!p.frases[k].length)return;
      const cls='ins '+(mapCor[k]||'');
      h+='<div class="'+cls+'" style="display:flex;flex-direction:column;gap:8px">';
      h+='<div class="ins-t">'+mapEmoji[k]+' '+mapLabel[k]+'</div>';
      p.frases[k].forEach(fr=>{
        h+='<div style="font-size:12px;color:var(--t2);line-height:1.5;padding:8px 10px;background:rgba(255,255,255,.02);border-radius:8px;border-left:2px solid var(--border)">"'+fr+'"</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }

  // === BLOCO Nuvem de palavras ===
  if(p.nuvem && p.nuvem.length){
    h+='<div class="sec">☁️ Nuvem de palavras</div>';
    h+='<div class="card"><h3>Termos mais usados pelos alunos</h3><div class="d">O que mais aparece nas mensagens recebidas · '+p.label.toLowerCase()+'</div>';
    const nuvMax=Math.max.apply(null,p.nuvem.map(x=>x.n));
    const nuvMin=Math.min.apply(null,p.nuvem.map(x=>x.n));
    const nuvCores=['#22d3ee','#34d399','#8b7cf7','#f472b6','#fbbf24','#38bdf8','#fb923c','#a78bfa'];
    h+='<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;padding:24px 10px;line-height:1.25">';
    p.nuvem.forEach((x,i)=>{
      const t=nuvMax>nuvMin?(x.n-nuvMin)/(nuvMax-nuvMin):1;
      const fs=(13+t*30).toFixed(0);
      const op=(0.55+t*0.45).toFixed(2);
      const peso=600+Math.round(t*200);
      const cor=nuvCores[i%nuvCores.length];
      const tip='<div class=tt-title>☁️ '+x.w+'</div><div class=tt-row><span class=tt-label>Aparições:</span><span class=tt-value>'+fN(x.n)+'</span></div>';
      h+='<span style="font-size:'+fs+'px;color:'+cor+';opacity:'+op+';font-weight:'+peso+';cursor:default" onmouseenter="showTip(event,\''+tip.replace(/'/g,'')+'\')" onmousemove="showTip(event,\''+tip.replace(/'/g,'')+'\')" onmouseleave="hideTip()">'+x.w+'</span>';
    });
    h+='</div></div>';
  }

  // === BLOCO Copys do disparo (por período, por tipo) ===
  const CPlist=(S.copys && S.copys[fKey] && S.copys[fKey].length)?S.copys[fKey]:null;
  if(CPlist){
    const CM={onboarding:{l:'Onboarding',e:'📨',c:'var(--accent)'},engajamento:{l:'Engajamento',e:'💪',c:'#34d399'},reabridor:{l:'Reabridor 24h',e:'🔓',c:'#fb923c'},renovacao:{l:'Renovação',e:'🔄',c:'#a78bfa'},outras:{l:'Outras mensagens',e:'💬',c:'#94a3b8'}};
    const totEnv=CPlist.reduce((a,b)=>a+(+b.n||0),0);
    h+='<div class="sec">✍️ Copys do disparo — '+p.label+'</div>';
    h+='<div class="card"><h3>Estratégias de disparo do período</h3><div class="d">'+CPlist.length+' tipo(s) de mensagem · '+fN(totEnv)+' envios no total · copy = 1ª mensagem do disparo (nota privada do bot)</div>';
    CPlist.forEach(cp=>{
      const m=CM[cp.tipo]||{l:cp.tipo,e:'💬',c:'#94a3b8'};
      h+='<div style="margin:14px 0;padding:14px 16px;background:rgba(255,255,255,.02);border-radius:10px;border-left:3px solid '+m.c+'">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">';
      h+='<div style="font-weight:700;font-size:13px;color:var(--t1)">'+m.e+' '+m.l+'</div>';
      h+='<div style="background:'+m.c+';color:#fff;font-family:JetBrains Mono;font-weight:700;font-size:11px;border-radius:8px;padding:3px 10px;white-space:nowrap">'+fN(cp.n)+' envios</div>';
      h+='</div>';
      h+='<div style="font-size:12.5px;color:var(--t2);line-height:1.55;white-space:pre-wrap">'+(cp.exemplo||'').replace(/</g,"&lt;")+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  // === BLOCO Ritmo (gráfico de barras) ===
  if(p.ritmo && p.ritmo.length){
    h+='<div class="sec">📈 Ritmo diário</div>';
    h+='<div class="card"><h3>Mensagens por dia</h3><div class="d">Recebidas (aluno) vs enviadas (TCS)</div>';
    const max=Math.max.apply(null, p.ritmo.flatMap(d=>[d.rec,d.env]));
    h+='<div style="display:flex;align-items:flex-end;gap:8px;height:200px;margin-top:18px;padding:0 4px">';
    p.ritmo.forEach(d=>{
      const hRec=max?Math.max(2,(d.rec/max)*180):0;
      const hEnv=max?Math.max(2,(d.env/max)*180):0;
      const tipR='<div class=tt-title>📅 '+d.dia+'</div><div class=tt-row><span class=tt-label>Recebidas (aluno):</span><span class=tt-value>'+fN(d.rec)+'</span></div><div class=tt-row><span class=tt-label>Enviadas (TCS):</span><span class=tt-value>'+fN(d.env)+'</span></div><div class=tt-row><span class=tt-label>Total:</span><span class=tt-value>'+fN(d.rec+d.env)+'</span></div>';
      h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default" onmouseenter="showTip(event,\''+tipR.replace(/'/g,'')+'\')" onmousemove="showTip(event,\''+tipR.replace(/'/g,'')+'\')" onmouseleave="hideTip()">';
      h+='<div style="display:flex;gap:3px;align-items:flex-end;height:180px">';
      h+='<div style="width:14px;height:'+hRec+'px;background:var(--accent);border-radius:3px 3px 0 0"></div>';
      h+='<div style="width:14px;height:'+hEnv+'px;background:var(--teal);border-radius:3px 3px 0 0"></div>';
      h+='</div>';
      h+='<div style="font-size:10px;color:var(--t3);font-family:JetBrains Mono">'+d.dia+'</div>';
      h+='</div>';
    });
    h+='</div>';
    h+='<div style="display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--t2)"><div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--accent);border-radius:3px"></div>Recebidas (aluno)</div><div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--teal);border-radius:3px"></div>Enviadas (TCS)</div></div>';
    h+='</div>';
  }

  // === BLOCO Heatmap por hora ===
  if(p.heatmap && p.heatmap.length===24){
    h+='<div class="sec">🕒 Quando o aluno fala</div>';
    h+='<div class="card"><h3>Mensagens por hora do dia</h3><div class="d">Período: '+p.label.toLowerCase()+' · fuso América/São Paulo</div>';
    const maxH=Math.max.apply(null,p.heatmap);
    h+='<div style="display:flex;gap:3px;align-items:flex-end;height:120px;margin-top:18px">';
    for(let i=0;i<24;i++){
      const v=p.heatmap[i];
      const alt=maxH?Math.max(3,(v/maxH)*110):3;
      const opacity=maxH?Math.max(.15,v/maxH):.15;
      const tipH='<div class=tt-title>🕒 '+(i<10?'0'+i:i)+'h00 — '+(i<10?'0'+i:i)+'h59</div><div class=tt-row><span class=tt-label>Mensagens:</span><span class=tt-value>'+fN(v)+'</span></div><div class=tt-row><span class=tt-label>% do pico:</span><span class=tt-value>'+(maxH?(100*v/maxH).toFixed(0):'0')+'%</span></div>';
      h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default" onmouseenter="showTip(event,\''+tipH.replace(/'/g,'')+'\')" onmousemove="showTip(event,\''+tipH.replace(/'/g,'')+'\')" onmouseleave="hideTip()">';
      h+='<div style="width:100%;height:'+alt+'px;background:var(--accent);opacity:'+opacity.toFixed(2)+';border-radius:3px 3px 0 0"></div>';
      h+='<div style="font-size:9px;color:var(--t3);font-family:JetBrains Mono">'+(i<10?'0'+i:i)+'</div>';
      h+='</div>';
    }
    h+='</div></div>';
  }

  // === Rodapé com fonte de dados ===
  h+='<div style="margin-top:32px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--t3);line-height:1.6;font-family:JetBrains Mono">';
  h+='Fonte: Supabase CS-IA · cliente Bruno Lucarelli · exclui contatos "Tiago"/"Teste" · disparo = cada nota privada do bot (cada mensagem conta, mesmo aluno pode receber várias) · resposta = aluno respondeu antes do próximo disparo · 1 conversa = 1 assunto dominante (classificação hierárquica)';
  h+='</div>';

  cont.innerHTML=h;
}

</script></body></html>
